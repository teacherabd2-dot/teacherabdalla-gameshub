<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EA;--ink:#1B2B4B;--accent:#FFC83D;--card:#fff;--line:color-mix(in srgb,var(--ink) 15%,var(--bg));--muted:color-mix(in srgb,var(--ink) 65%,var(--bg))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
#bar{position:fixed;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
.tb{font:inherit;font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;background:var(--card);border:2px solid var(--line);color:#1B2B4B;cursor:pointer}
.tb:hover,.tb:focus-visible{border-color:var(--accent);outline:none}
header{max-width:960px;margin:auto;padding:64px 20px 12px;display:flex;gap:16px;align-items:center}
#logo{width:72px;height:72px;object-fit:contain;border-radius:16px;display:none}
h1{font-size:clamp(28px,6vw,48px);font-weight:800;margin:0;line-height:1.15}
h1::after{content:"";display:block;width:80px;height:8px;background:var(--accent);border-radius:6px;margin-top:10px}
#s{color:var(--muted);font-size:18px;margin:10px 0 0}
.tools{max-width:960px;margin:auto;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap}
input,textarea,select{font:inherit}
input[type=search]{flex:1 1 200px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:#1B2B4B}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-size:15px;padding:6px 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:#1B2B4B;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:960px;margin:auto;padding:12px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.cw{position:relative}
a.game{position:relative;height:100%;display:flex;flex-direction:column;gap:4px;padding:20px;background:var(--card);border:2px solid var(--line);border-radius:18px;color:#1B2B4B;text-decoration:none;transition:transform .15s,border-color .15s}
a.game:hover,a.game:focus-visible{transform:translateY(-4px);border-color:var(--accent);outline:none}
.emoji{font-size:42px;line-height:1}.name{font-weight:800;font-size:19px}.subj{color:#5B6783;font-size:14px}
.new{position:absolute;top:14px;right:14px;background:#E4572E;color:#fff;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px}
.pen{position:absolute;bottom:12px;right:12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:18px;z-index:2}
.pen:hover,.pen:focus-visible{border-color:var(--accent);outline:none}
.msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{text-align:center;color:var(--muted);padding:0 20px 40px;font-size:14px}
.ov{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow:auto}
.ov[hidden]{display:none}
.dlg{background:#fff;color:#1B2B4B;border-radius:16px;padding:20px;width:100%;max-width:520px;margin:auto}
.dlg h2{margin:0 0 8px;font-size:22px}
.dlg label{display:block;font-size:14px;margin:10px 0 3px;color:#4A5873}
.dlg input,.dlg textarea{width:100%;padding:9px 12px;border:1px solid #C5CEDF;border-radius:10px;background:#fff;color:#1B2B4B;min-width:0}
.dlg input[type=color]{height:42px;padding:2px}
.dlg button{font:inherit;font-weight:700;padding:9px 16px;border:0;border-radius:10px;background:#1B2B4B;color:#fff;cursor:pointer}
.dlg button.alt{background:#fff;color:#1B2B4B;border:1px solid #C5CEDF}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1 1 130px;min-width:0}
.pre{display:flex;gap:8px;flex-wrap:wrap}.pre button{border-radius:999px!important}
.err{color:#C0392B;font-size:14px;min-height:20px;margin:8px 0 0}.note{font-size:14px;color:#4A5873}
@media (prefers-reduced-motion:reduce){a.game{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<header><img id="logo" alt=""><div><h1 id="t">English Games</h1><p id="s"></p></div></header>
<div class="tools"><input type="search" id="q" placeholder="Search games…" aria-label="Search"><div class="chips" id="chips"></div></div>
<main id="list"><p class="msg">Loading…</p></main>
<footer id="f"></footer>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<script type="module">
import {FB,TEACHER} from "./firebase-config.js";
const $=id=>document.getElementById(id), val=id=>$(id).value.trim();
const ready=!!(FB&&FB.apiKey&&FB.projectId);
const DEF={title:"Teacher Abdalla Ragab",subtitle:"English Games – pick a game and start playing!",theme:{bg:"#FFF8EA",ink:"#1B2B4B",accent:"#FFC83D"},logo:""};
const PRE={Sunny:["#FFF8EA","#1B2B4B","#FFC83D"],Ocean:["#EAF6FF","#0B3C5D","#2EC4B6"],Forest:["#F1F8EC","#1F4D2B","#F2B134"],Berry:["#FFF0F5","#4A1942","#FF7AA2"],Night:["#161B2E","#F4EFE2","#FFC83D"]};
let cfg={...DEF},loaded=false,all=[],skill="All",user=null,db,auth,S={};

function applyCfg(){const th=cfg.theme||DEF.theme,r=document.documentElement.style;
  r.setProperty("--bg",th.bg);r.setProperty("--ink",th.ink);r.setProperty("--accent",th.accent);
  $("t").textContent=cfg.title;document.title=cfg.title+" – English Games";$("s").textContent=cfg.subtitle||"";$("f").textContent="© "+cfg.title;
  const l=$("logo");l.onload=()=>l.style.display="block";l.onerror=()=>l.style.display="none";
  if(cfg.logo)l.src=cfg.logo;else l.style.display="none"}
function render(){const q=$("q").value.trim().toLowerCase(),list=$("list");list.textContent="";
  if(!loaded){const p=document.createElement("p");p.className="msg";p.textContent="Loading games…";list.appendChild(p);return}
  const items=all.filter(g=>(skill==="All"||g.skill===skill)&&(!q||((g.title||"")+" "+(g.skill||"")).toLowerCase().includes(q)));
  if(!items.length){const p=document.createElement("p");p.className="msg";p.textContent=all.length?"No games found.":"No games yet.";list.appendChild(p);return}
  items.forEach(g=>{const w=document.createElement("div");w.className="cw";
    const a=document.createElement("a");a.className="game";a.href=g.url;a.target="_blank";a.rel="noopener";
    if(g.ts&&Date.now()-g.ts<14*864e5){const n=document.createElement("span");n.className="new";n.textContent="New";a.appendChild(n)}
    [["emoji",g.emoji||"🎮"],["name",g.title],["subj",g.skill||""]].forEach(([c,t])=>{const d=document.createElement("div");d.className=c;d.textContent=t;a.appendChild(d)});
    w.appendChild(a);
    if(user&&g.id){const p=document.createElement("button");p.className="pen";p.textContent="✏️";p.title="Edit";p.setAttribute("aria-label","Edit "+g.title);p.onclick=()=>gameDlg(g);w.appendChild(p)}
    list.appendChild(w)})}
function chips(){const subs=[...new Set(all.map(g=>g.skill).filter(Boolean))];if(skill!=="All"&&!subs.includes(skill))skill="All";
  const c=$("chips");c.textContent="";["All",...subs].forEach(s=>{const b=document.createElement("button");b.className="chip";b.textContent=s;b.setAttribute("aria-pressed",s===skill);b.onclick=()=>{skill=s;chips();render()};c.appendChild(b)})}
function bar(){const b=$("bar");b.textContent="";
  const add=(t,f,l)=>{const x=document.createElement("button");x.className="tb";x.textContent=t;if(l)x.setAttribute("aria-label",l);x.onclick=f;b.appendChild(x)};
  if(!user)add("🔒 Teacher",loginUI);else{add("＋ Add game",()=>gameDlg());add("⚙️",settings,"Settings");add("Log out",()=>S.signOut(auth))}}

function open(title,html){const d=$("dlg");d.innerHTML="<h2></h2>"+html;d.firstChild.textContent=title;$("ov").hidden=false;return d}
function close(){$("ov").hidden=true;$("dlg").textContent=""}
$("ov").onclick=e=>{if(e.target.id==="ov")close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});

function loginUI(){
  if(!ready){open("Teacher login",'<p>Login is not set up yet. Fill in <b>firebase-config.js</b> with your Firebase details, then reload.</p><button id="x">Close</button>');$("x").onclick=close;return}
  open("Teacher login",'<label for="le">Gmail</label><input id="le" type="email" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><p id="er" class="err"></p><div class="row"><button id="go">Sign in</button><button class="alt" id="gg">Sign in with Google</button></div><p><a href="#" id="fp">Forgot password?</a></p>');
  const fail=e=>{$("er").textContent=/invalid-credential|wrong-password|user-not-found/.test(e.code||"")?"Wrong email or password.":(e.message||"Sign-in failed.")};
  $("go").onclick=()=>S.signInWithEmailAndPassword(auth,val("le"),$("lp").value).then(()=>close()).catch(fail);
  $("gg").onclick=()=>S.signInWithPopup(auth,new S.GoogleAuthProvider()).then(()=>close()).catch(fail);
  $("fp").onclick=e=>{e.preventDefault();if(!val("le")){$("er").textContent="Type your Gmail first.";return}S.sendPasswordResetEmail(auth,val("le")).then(()=>{$("er").textContent="Reset email sent. Check your inbox."}).catch(fail)};
  $("lp").onkeydown=e=>{if(e.key==="Enter")$("go").click()}}

function gameDlg(g){const add=!g;
  open(add?"Add a game":"Edit game",'<datalist id="sk"><option>Vocabulary<option>Grammar<option>Reading<option>Listening<option>Speaking<option>Writing<option>Phonics</datalist><div class="row"><div style="flex:0 0 80px"><label for="ge">Emoji</label><input id="ge"></div><div style="flex:1 1 180px"><label for="gt">Title</label><input id="gt"></div><div style="flex:1 1 140px"><label for="gs">Skill</label><input id="gs" list="sk"></div></div>'
    +((add||!g.codeId)?'<label for="gu">Game link (Canva, Gemini, games/file.html…)</label><input id="gu">':'<p class="note">This game runs from code stored on your site.</p>')
    +'<label for="gc">'+(add?"Or paste the game's HTML code":"Paste new code to replace it (optional)")+'</label><textarea id="gc" rows="6"></textarea><p id="er" class="err"></p><div class="row"><button id="sv">Save</button>'+(add?"":'<button class="alt" id="dl">Delete</button>')+'</div>');
  $("ge").value=g?g.emoji||"🎮":"🎮";$("gt").value=g?g.title:"";$("gs").value=g?g.skill||"":"";if($("gu"))$("gu").value=g&&!g.codeId?g.url:"";
  $("sv").onclick=async()=>{const t=val("gt"),c=$("gc").value.trim(),u=$("gu")?val("gu"):"";
    if(!t||(add&&!c&&!u)){$("er").textContent="Enter a title and a link or code.";return}
    const data={title:t,skill:val("gs")||"General",emoji:val("ge")||"🎮"};
    try{let cid=g&&g.codeId;
      if(c){cid=cid||S.doc(S.collection(db,"code")).id;await S.setDoc(S.doc(db,"code",cid),{html:c});data.codeId=cid;data.url="play.html?id="+cid}
      else if($("gu"))data.url=u||g.url;
      if(add){data.ts=Date.now();await S.addDoc(S.collection(db,"games"),data)}else await S.updateDoc(S.doc(db,"games",g.id),data);
      close()}catch(e){$("er").textContent="Could not save: "+e.message}};
  if(!add)$("dl").onclick=async()=>{if(!confirm("Delete this game?"))return;
    try{await S.deleteDoc(S.doc(db,"games",g.id));if(g.codeId)await S.deleteDoc(S.doc(db,"code",g.codeId));close()}catch(e){$("er").textContent="Could not delete: "+e.message}}}

function settings(){
  open("Settings",'<label for="st">Site title</label><input id="st"><label for="ss">Subtitle</label><input id="ss"><label>Theme</label><div class="pre" id="pr"></div><div class="row"><div><label for="c1">Background</label><input type="color" id="c1"></div><div><label for="c2">Text &amp; main</label><input type="color" id="c2"></div><div><label for="c3">Highlight</label><input type="color" id="c3"></div></div><label for="lf">Logo (PNG or JPG)</label><input type="file" id="lf" accept="image/*"><p id="er" class="err"></p><div class="row"><button id="sv">Save settings</button><button class="alt" id="ri">Remove logo</button></div><hr><p class="note">One time only: copy the games from your old games.json into the new system.</p><button class="alt" id="im">Import games from games.json</button>');
  const th=cfg.theme||DEF.theme;let logo=cfg.logo||"";
  $("st").value=cfg.title;$("ss").value=cfg.subtitle||"";$("c1").value=th.bg;$("c2").value=th.ink;$("c3").value=th.accent;
  Object.entries(PRE).forEach(([n,c])=>{const b=document.createElement("button");b.className="sw";b.textContent=n;b.style.cssText="background:"+c[0]+";color:"+c[1]+";border:2px solid "+c[2];b.onclick=()=>{$("c1").value=c[0];$("c2").value=c[1];$("c3").value=c[2]};$("pr").appendChild(b)});
  $("lf").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,256/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);logo=cv.toDataURL("image/png");$("er").textContent="Logo ready. Press Save settings."};im.src=URL.createObjectURL(f)};
  $("ri").onclick=()=>{logo="";$("er").textContent="The logo will be removed when you save."};
  $("sv").onclick=async()=>{try{await S.setDoc(S.doc(db,"site","config"),{title:val("st")||DEF.title,subtitle:$("ss").value.trim(),theme:{bg:$("c1").value,ink:$("c2").value,accent:$("c3").value},logo});close()}catch(e){$("er").textContent="Could not save: "+e.message}};
  $("im").onclick=async()=>{try{const j=await(await fetch("games.json?v="+Date.now())).json(),have=new Set(all.map(g=>g.url));let n=0;
    for(const [i,g] of (j.games||[]).entries()){if(have.has(g.url))continue;await S.addDoc(S.collection(db,"games"),{title:g.title,skill:g.skill||g.subject||"General",emoji:g.emoji||"🎮",url:g.url,ts:(Date.parse(g.date)||Date.now())+i});n++}
    $("er").textContent="Imported "+n+" games."}catch(e){$("er").textContent="Import failed: "+e.message}}}

function loadStatic(){fetch("games.json?v="+Date.now()).then(r=>r.json()).then(d=>{
  cfg={...DEF,title:d.title||DEF.title,subtitle:d.subtitle||"",theme:d.theme||DEF.theme,logo:d.logo||""};applyCfg();
  all=(d.games||[]).slice().reverse().map(g=>({...g,skill:g.skill||g.subject,ts:Date.parse(g.date)||0}));loaded=true;chips();render()
}).catch(()=>{$("list").textContent="Could not load the games."})}

const CK="gh_cache_v1",save=()=>{try{localStorage.setItem(CK,JSON.stringify({cfg,all}))}catch(e){}};
if(ready)try{const c=JSON.parse(localStorage.getItem(CK)||"null");if(c&&c.all){cfg={...DEF,...c.cfg};all=c.all;loaded=true}}catch(e){}
$("q").addEventListener("input",render);applyCfg();bar();if(loaded){chips();render()}
if(!ready)loadStatic();
else try{
  const V="https://www.gstatic.com/firebasejs/10.12.2/";
  const [A,B,C]=await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")]);
  const app=A.initializeApp(FB);auth=B.getAuth(app);db=C.getFirestore(app);S={...B,...C};
  B.onAuthStateChanged(auth,u=>{
    if(u&&TEACHER&&(u.email||"").toLowerCase()!==TEACHER.toLowerCase()){B.signOut(auth);alert("This account is not allowed to edit the site.");return}
    user=u;bar();render()});
  C.onSnapshot(C.query(C.collection(db,"games"),C.orderBy("ts","desc")),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;save();chips();render()},()=>loadStatic());
  C.onSnapshot(C.doc(db,"site","config"),s=>{if(s.exists()){cfg={...DEF,...s.data()};applyCfg();save()}});
}catch(e){loadStatic()}
</script>
</body>
</html>
